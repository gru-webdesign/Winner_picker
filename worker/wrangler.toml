name = "zreb-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# Adresa sajta sa koje je dozvoljen pristup. Više adresa odvoji zarezom.
ALLOWED_ORIGINS = "https://gru-webdesign.github.io"
# Najviše komentara po objavi i objava po žrebu (štiti Apify kredit).
MAX_COMMENTS = "2000"
MAX_POSTS = "10"

# APIFY_TOKEN se ne upisuje ovde. Postavi ga komandom:
#   npx wrangler secret put APIFY_TOKEN
